[project]
name = "threadweave-memory"
version = "0.4.6"
description = "Enterprise organizational memory system — wraps MemPalace"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mempalace>=3.5.0",
    "qdrant-client>=1.9",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "python-multipart>=0.0.6",
    "httpx>=0.26",
    "requests>=2.31",
    "psutil>=5.9",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
]
gws = [
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
    "requests>=2.31",
]
graph = [
    "msal>=1.28",
    "requests>=2.31",
]
teams = [
    "botbuilder-core>=4.15",
    "botbuilder-integration-aiohttp>=4.15",
    "aiohttp>=3.9",
    "msal>=1.28",
]
sharepoint = [
    "msal>=1.28",
    "httpx>=0.26",
    "pymupdf>=1.24; platform_system != 'Windows' or python_version >= '3.11'",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "faster-whisper>=1.0",
]
email = [
    "msal>=1.28",
    "httpx>=0.26",
]
outlook = [
    "pywin32>=306",
]
all-connectors = [
    "botbuilder-core>=4.15",
    "botbuilder-integration-aiohttp>=4.15",
    "aiohttp>=3.9",
    "msal>=1.28",
    "httpx>=0.26",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
    "requests>=2.31",
]

[project.scripts]
threadweave = "threadweave.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
