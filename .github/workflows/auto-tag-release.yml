name: Auto-release on push

# Every push to master with code changes produces a release. The
# workflow compares HEAD against the latest v* tag: if code changed
# since the tag, it auto-increments the patch version (0.4.0 ->
# 0.4.1), tags, and publishes the GitHub Release with generated notes.
# Manual minor/major bumps (0.4.x -> 0.5.0) are honored as-is.
#
# Loop safety: the bump commit re-triggers this workflow; concurrency
# serializes the runs, and the re-run sees no code diff since the new
# tag, so it exits without doing anything.

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags for the tag comparison

      - name: Read current version
        id: version
        run: |
          # A text file committed from Windows can carry CRLF, and a trailing CR
          # makes the tag name invalid and hides a code change from the bump check.
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/^version = "\(.*\)"/\1/' | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "latest tag: $(git tag -l 'v*' | sort -V | tail -1 || true)"

      - name: Check for code changes since the latest tag
        id: code
        run: |
          LATEST=$(git tag -l 'v*' | sort -V | tail -1 || true)
          if [ -z "$LATEST" ]; then
            # No tags yet: anything on master is release material
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$LATEST" HEAD \
             | grep -vE '^(docs/|README|CHANGELOG|\.github/|.*\.md$)' \
             | grep -q .; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect manual version bump
        id: manual
        run: |
          LATEST="${{ steps.code.outputs.latest }}"
          CUR="${{ steps.version.outputs.version }}"
          if [ -n "$LATEST" ] && [ "$LATEST" = "v$CUR" ]; then
            echo "manual=false" >> "$GITHUB_OUTPUT"
          else
            echo "manual=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to publish an empty release
        # The v0.4.26 incident: a branch cut before a version bump merges
        # cleanly, its [Unreleased] entry lands inside an already released
        # section, and the bump below files an empty [Unreleased] as the new
        # release's content. The guard runs BEFORE the bump commit, so a refusal
        # leaves master, the version literals and the tags untouched: the fix is
        # a changelog push, and this workflow runs again on it (has_code is
        # measured against the last tag, not the last commit).
        if: steps.code.outputs.has_code == 'true'
        run: |
          # Plain shell variables rather than a bash array: the step runs on the
          # runner's bash, and a value that is empty must simply contribute no
          # argument. Both values are a version and a tag, neither of which can
          # contain whitespace.
          BASE=""
          if [ -n "${{ steps.code.outputs.latest }}" ]; then
            BASE="--base-rev ${{ steps.code.outputs.latest }}"
          fi
          SECTION=""
          if [ "${{ steps.manual.outputs.manual }}" = "true" ]; then
            # A hand-written bump publishes its own dated section, not
            # [Unreleased]; an empty one must not ship either.
            SECTION="--version ${{ steps.version.outputs.version }}"
          fi
          set -x
          python3 scripts/changelog_release.py check --changelog CHANGELOG.md $BASE $SECTION

      - name: Auto-increment patch version
        id: bumped
        if: steps.code.outputs.has_code == 'true' && steps.manual.outputs.manual == 'false'
        run: |
          python - <<'EOF'
          import datetime
          import re
          import sys

          path = "pyproject.toml"
          text = open(path, encoding="utf-8").read()
          new_text, n = re.subn(
              r'^version = "(\d+)\.(\d+)\.(\d+)"',
              lambda m: f'version = "{m.group(1)}.{m.group(2)}.{int(m.group(3)) + 1}"',
              text, count=1, flags=re.M,
          )
          if n != 1:
              raise SystemExit("could not bump version in pyproject.toml")
          open(path, "w", encoding="utf-8").write(new_text)
          version = re.search(
              r'^version = "([^"]+)"', new_text, re.M
          ).group(1)

          # Sync every version source so the drift-guard tests pass
          # after the bump (pyproject alone used to leave api.py,
          # changelog, and the health test behind, forcing a manual
          # follow-up commit on every auto-release).

          api_path = "src/threadweave/api.py"
          api_text = open(api_path, encoding="utf-8").read()
          api_text, n = re.subn(
              r'version="\d+\.\d+\.\d+"', f'version="{version}"', api_text
          )
          if n != 2:
              raise SystemExit(f"expected 2 version literals in api.py, found {n}")
          open(api_path, "w", encoding="utf-8").write(api_text)

          test_path = "tests/test_api.py"
          test_text = open(test_path, encoding="utf-8").read()
          test_text, n = re.subn(
              r'assert data\["version"\] == "\d+\.\d+\.\d+"',
              f'assert data["version"] == "{version}"', test_text,
          )
          if n != 1:
              raise SystemExit(f"expected 1 version assertion in test_api.py, found {n}")
          open(test_path, "w", encoding="utf-8").write(test_text)

          # The [Unreleased] section becomes the new release's content, through
          # the same module the guard above used, so the section that was
          # approved is the section that is filed.
          sys.path.insert(0, "scripts")
          import changelog_release

          changelog_path = "CHANGELOG.md"
          changelog = open(changelog_path, encoding="utf-8").read()
          new_changelog = changelog_release.migrate(
              changelog, version, datetime.date.today().isoformat()
          )
          # newline="\n" so a Windows checkout files the changelog with the same
          # LF endings .gitattributes requires, rather than CRLF.
          with open(
              changelog_path, "w", encoding="utf-8", newline="\n"
          ) as handle:
              handle.write(new_changelog)
          EOF
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/^version = "\(.*\)"/\1/' | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/threadweave/api.py tests/test_api.py CHANGELOG.md
          # [skip ci] prevents this commit from re-triggering the
          # workflow (otherwise the bump itself looks like a code
          # change and the version would increment forever)
          git commit -m "chore: bump version to v$VERSION [skip ci]"
          git push origin master

      - name: Tag the release
        if: steps.code.outputs.has_code == 'true'
        run: |
          VERSION="${{ steps.bumped.outputs.version || steps.version.outputs.version }}"
          if git tag -l "v$VERSION" | grep -q .; then
            echo "tag v$VERSION already exists locally — skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Publish the release
        if: steps.code.outputs.has_code == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bumped.outputs.version || steps.version.outputs.version }}"
          generate_release_notes: true
          # Zero-touch: releases publish immediately
