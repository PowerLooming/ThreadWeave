<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreadWeave — Organizational Memory</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:2rem}
header{margin-bottom:2rem;text-align:center}
h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#94a3b8;margin-top:.5rem}
.card{background:#1e293b;border-radius:.75rem;padding:1.5rem;margin-bottom:1rem;border:1px solid #334155}
.card h3{margin-bottom:.75rem;color:#e2e8f0}
input,textarea,select{width:100%;padding:.75rem;background:#0f172a;border:1px solid #334155;border-radius:.5rem;color:#e2e8f0;font-size:.9rem;margin-bottom:.75rem;font-family:inherit}
textarea{min-height:120px;resize:vertical}
button{background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;border:none;padding:.75rem 1.5rem;border-radius:.5rem;cursor:pointer;font-weight:600;font-size:.9rem}
button:hover{opacity:.9}
.result{border-left:3px solid #6366f1;padding:.75rem;margin:.5rem 0;background:#1a2332;border-radius:0 .5rem .5rem 0}
.result .wing{color:#0ea5e9;font-size:.8rem}
.result .preview{color:#94a3b8;font-size:.85rem;margin-top:.25rem}
.tag{display:inline-block;padding:.15rem .5rem;border-radius:.25rem;font-size:.75rem;margin:.25rem}
.tag-team{background:rgba(99,102,241,.2);color:#a5b4fc}
.tag-scope{background:rgba(14,165,233,.2);color:#67e8f9}
.tag-type{background:rgba(52,211,153,.2);color:#6ee7b7}
.status{text-align:center;color:#94a3b8;padding:1rem}
.error{color:#fb7185;text-align:center;padding:1rem}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tab{padding:.5rem 1rem;border-radius:.5rem;cursor:pointer;background:#1e293b;border:1px solid #334155;color:#94a3b8}
.tab.active{background:rgba(99,102,241,.2);border-color:#6366f1;color:#e2e8f0}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>ThreadWeave</h1>
    <p class="subtitle">Organizational Memory System</p>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('detect')">Detect</div>
    <div class="tab" onclick="switchTab('save')">Save</div>
    <div class="tab" onclick="switchTab('search')">Search</div>
  </div>

  <!-- Detect Tab -->
  <div id="tab-detect" class="card">
    <h3>Analyze Text</h3>
    <p style="color:#94a3b8;margin-bottom:.75rem;font-size:.85rem">
      Paste any text (email, Slack message, PR comment) to check if it should be saved as organizational knowledge.
    </p>
    <textarea id="detect-text" placeholder="Paste text here..."></textarea>
    <button onclick="doDetect()">Analyze</button>
    <div id="detect-result"></div>
  </div>

  <!-- Save Tab -->
  <div id="tab-save" class="card" style="display:none">
    <h3>Save Knowledge</h3>
    <input id="save-wing" placeholder="Team/Department (e.g. engineering)">
    <input id="save-room" placeholder="Topic (e.g. deployment)" value="general">
    <textarea id="save-content" placeholder="Knowledge to save..."></textarea>
    <select id="save-scope">
      <option value="team">Team only</option>
      <option value="department">Department</option>
      <option value="organization">Organization-wide</option>
    </select>
    <button onclick="doSave()">Save to Memory</button>
    <div id="save-result"></div>
  </div>

  <!-- Search Tab -->
  <div id="tab-search" class="card" style="display:none">
    <h3>Search Memory</h3>
    <input id="search-query" placeholder="What do you need to know?">
    <button onclick="doSearch()">Search</button>
    <div id="search-result"></div>
  </div>
</div>

<script>
const API = 'http://localhost:8000/api/v1';

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('[id^="tab-"]').forEach(d => d.style.display = 'none');
  document.querySelector(`.tab:nth-${tab==='detect'?'1':tab==='save'?'2':'3'}-child`).classList.add('active');
  document.getElementById(`tab-${tab}`).style.display = '';
}

async function doDetect() {
  const text = document.getElementById('detect-text').value;
  const res = document.getElementById('detect-result');
  if (!text) { res.innerHTML = '<p class="error">Please enter text</p>'; return; }

  try {
    const r = await fetch(`${API}/detect`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})
    });
    const d = await r.json();
    const color = d.should_save ? '#34d399' : '#94a3b8';
    res.innerHTML = `
      <div class="result">
        <strong style="color:${color}">${d.should_save ? 'SAVE' : 'SKIP'}</strong>
        — ${d.content_type} (${(d.confidence*100).toFixed(0)}%)
        ${d.has_pii ? '<span class="tag tag-scope">PII detected</span>' : ''}
        ${d.suggested_title ? `<p style="margin-top:.25rem;color:#94a3b8">Title: ${d.suggested_title}</p>` : ''}
        <p style="font-size:.8rem;color:#64748b;margin-top:.25rem">Scope: ${d.suggested_scope} | Signals: ${d.signals.join(', ') || 'none'}</p>
        ${d.entities.length ? '<p style="font-size:.8rem;color:#64748b">Entities: ' + d.entities.map(e=>e.value).join(', ') + '</p>' : ''}
      </div>`;
  } catch(e) { res.innerHTML = '<p class="error">Server not reachable</p>'; }
}

async function doSave() {
  const content = document.getElementById('save-content').value;
  const wing = document.getElementById('save-wing').value;
  const res = document.getElementById('save-result');
  if (!content || !wing) { res.innerHTML = '<p class="error">Content and team are required</p>'; return; }

  try {
    const r = await fetch(`${API}/entries`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        content, wing,
        room: document.getElementById('save-room').value || 'general',
        scope: document.getElementById('save-scope').value,
        source_type: 'web',
      })
    });
    const d = await r.json();
    res.innerHTML = `<div class="result" style="border-color:#34d399">
      Saved! <strong>${d.id}</strong> → ${d.wing}/${d.room}
      <p style="color:#94a3b8;font-size:.85rem">${d.title || ''}</p>
    </div>`;
    document.getElementById('save-content').value = '';
  } catch(e) { res.innerHTML = '<p class="error">Server not reachable</p>'; }
}

async function doSearch() {
  const query = document.getElementById('search-query').value;
  const res = document.getElementById('search-result');
  if (!query) { res.innerHTML = '<p class="error">Enter a query</p>'; return; }

  try {
    const r = await fetch(`${API}/search`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({query, limit: 10})
    });
    const d = await r.json();
    if (!d.results.length) {
      res.innerHTML = '<p class="status">No results found</p>'; return;
    }
    res.innerHTML = `<p style="color:#94a3b8;margin-bottom:.5rem">Found ${d.total} results</p>` +
      d.results.map(r => `
        <div class="result">
          <span class="wing">${r.wing}/${r.room}</span>
          <span class="tag tag-team">${r.author_team || r.wing}</span>
          <span class="tag tag-type">${r.content_type || 'unknown'}</span>
          <div class="preview">${r.title || r.content_preview}</div>
          <div style="font-size:.75rem;color:#64748b;margin-top:.25rem">
            Score: ${typeof r.relevance_score === 'number' ? r.relevance_score.toFixed(2) : r.relevance_score} | ${r.created_at ? r.created_at.slice(0,10) : ''}
          </div>
        </div>`).join('');
  } catch(e) { res.innerHTML = '<p class="error">Server not reachable</p>'; }
}
</script>
</body>
</html>
